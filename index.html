<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>втакт</title>
<link rel="stylesheet" href="styles.css?v=26">
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="ui">
    <div class="hud hud-score">
      <span class="hud-cap">счёт</span><span id="hud-score" class="hud-num">0</span>
    </div>
    <div class="hud hud-best">
      <span id="hud-best-cap" class="hud-cap">рекорд</span><span id="hud-best" class="hud-best-num">0</span>
    </div>
    <div class="hud hud-tempo">
      <span id="hud-tempo" class="hud-num">84</span><span class="hud-cap">уд/мин</span>
    </div>
    <div id="hud-keys" class="hud hud-keys">space — пауза&nbsp;&nbsp;·&nbsp;&nbsp;r — заново</div>
    <div id="hint" class="hint"></div>

    <div id="over" class="pause-screen" hidden>
      <div class="pause-word">конец</div>
      <div class="over-line"><span id="over-who"></span> молчал три круга</div>
      <div class="over-score">счёт&nbsp;&nbsp;<span id="over-score">0</span></div>
      <div id="over-best" class="over-best"></div>
      <div class="pause-actions">
        <button id="over-again" class="pause-btn" type="button">заново</button>
        <button id="over-menu" class="pause-btn" type="button">в меню</button>
      </div>
    </div>

    <div id="pause" class="pause-screen" hidden>
      <div class="pause-word">пауза</div>
      <div class="pause-actions">
        <button id="pause-resume" class="pause-btn" type="button">продолжить</button>
        <button id="pause-quit" class="pause-btn" type="button">выйти в меню</button>
      </div>
    </div>

    <div id="title" class="title-screen">
      <div class="title-word">втакт</div>
      <div class="title-sub">мир дышит своим ритмом.<br>кликните по плитке в тот момент, когда контур коснётся её края.<br>каждая следующая стоит дороже — но молчащая тянет счёт вниз.</div>

      <form id="name-form" class="name-form" hidden>
        <input id="name-input" class="name-input" type="text" maxlength="18"
               autocomplete="off" spellcheck="false" placeholder="как вас зовут">
        <button class="name-go" type="submit">начать</button>
      </form>

      <div id="welcome" class="welcome" hidden>
        <div class="welcome-line">с возвращением, <span id="welcome-name"></span></div>
        <div id="welcome-best" class="welcome-best"></div>
        <div class="title-go">нажмите, чтобы начать</div>
      </div>

      <button id="change-name" class="link-btn" type="button" hidden>сменить имя</button>
    </div>
  </div>

  <!-- ?v= — против кэша GitHub Pages (max-age=600): поднимать при правках -->
  <script src="store.js?v=26"></script>
  <script src="audio.js?v=26"></script>
  <script src="game.js?v=26"></script>
</body>
</html>
