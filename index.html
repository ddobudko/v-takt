<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>втакт</title>
<link rel="stylesheet" href="styles.css?v=31">
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="ui">
    <div class="hud hud-score">
      <span class="hud-cap" data-i18n="hud.score">счёт</span><span id="hud-score" class="hud-num">0</span>
    </div>
    <div class="hud hud-best">
      <span id="hud-best-cap" class="hud-cap" data-i18n="hud.best">рекорд</span><span id="hud-best" class="hud-best-num">0</span>
    </div>
    <div class="hud hud-tempo">
      <span id="hud-tempo" class="hud-num">84</span><span class="hud-cap" data-i18n="hud.bpm">уд/мин</span>
    </div>
    <div id="hud-keys" class="hud hud-keys" data-i18n="hud.keys"></div>
    <div id="hint" class="hint"></div>

    <div id="over" class="pause-screen" hidden>
      <div class="pause-word" data-i18n="over.word">конец</div>
      <div class="over-line"><span id="over-who"></span> <span data-i18n="over.line">молчал три круга</span></div>
      <div class="over-score"><span data-i18n="over.score">счёт</span>&nbsp;&nbsp;<span id="over-score">0</span></div>
      <div id="over-best" class="over-best"></div>
      <div class="pause-actions">
        <button id="over-again" class="pause-btn" type="button" data-i18n="over.again">заново</button>
        <button id="over-menu" class="pause-btn" type="button" data-i18n="over.menu">в меню</button>
      </div>
    </div>

    <div id="pause" class="pause-screen" hidden>
      <div class="pause-word" data-i18n="pause.word">пауза</div>
      <div class="settings">
        <label class="set-row">
          <span class="set-cap" data-i18n="set.volume">громкость</span>
          <input class="vol" type="range" min="0" max="100" step="1" value="80">
        </label>
        <button class="set-btn full-btn" type="button" data-i18n="set.fullscreen">во весь экран</button>
      </div>
      <div class="pause-actions">
        <button id="pause-resume" class="pause-btn" type="button" data-i18n="pause.resume">продолжить</button>
        <button id="pause-quit" class="pause-btn" type="button" data-i18n="pause.quit">выйти в меню</button>
      </div>
    </div>

    <div id="title" class="title-screen">
      <div class="title-word">втакт</div>
      <div class="title-sub" data-i18n="title.sub"></div>

      <form id="name-form" class="name-form" hidden>
        <input id="name-input" class="name-input" type="text" maxlength="18"
               autocomplete="off" spellcheck="false" data-i18n-ph="title.name">
        <button class="name-go" type="submit" data-i18n="title.begin">начать</button>
      </form>

      <div id="welcome" class="welcome" hidden>
        <div class="welcome-line"><span data-i18n="title.welcome">с возвращением,</span> <span id="welcome-name"></span></div>
        <div id="welcome-best" class="welcome-best"></div>
        <div class="title-go" data-i18n="title.go">нажмите, чтобы начать</div>
      </div>

      <div class="settings title-settings">
        <label class="set-row">
          <span class="set-cap" data-i18n="set.volume">громкость</span>
          <input class="vol" type="range" min="0" max="100" step="1" value="80">
        </label>
        <button class="set-btn full-btn" type="button" data-i18n="set.fullscreen">во весь экран</button>
        <button class="set-btn lang-btn" type="button" data-i18n="set.lang">english</button>
      </div>

      <button id="change-name" class="link-btn" type="button" data-i18n="title.changeName" hidden>сменить имя</button>
    </div>
  </div>

  <!-- ?v= — против кэша GitHub Pages (max-age=600): поднимать при правках -->
  <script src="store.js?v=31"></script>
  <script src="i18n.js?v=31"></script>
  <script src="audio.js?v=31"></script>
  <script src="game.js?v=31"></script>
</body>
</html>
